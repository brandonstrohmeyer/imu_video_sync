name: Tag on merge

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'rc-') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure release workflow present
        run: |
          if [ ! -f .github/workflows/release.yml ]; then
            echo "Missing .github/workflows/release.yml on this branch."
            exit 1
          fi
          if ! grep -Fq "v*.*.*" .github/workflows/release.yml; then
            echo "release.yml does not include tag trigger (v*.*.*)."
            exit 1
          fi

      - name: Ensure PAT available
        run: |
          if [ -z "${{ secrets.RELEASE_TAG_PAT }}" ]; then
            echo "Missing RELEASE_TAG_PAT secret"
            exit 1
          fi

      - name: Ensure release workflow present
        run: |
          if [ ! -f .github/workflows/release.yml ]; then
            echo "Missing .github/workflows/release.yml on this branch."
            exit 1
          fi
          if ! grep -Fq "v*.*.*" .github/workflows/release.yml; then
            echo "release.yml does not include tag trigger (v*.*.*)."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version from CHANGELOG.md
        id: changelog
        run: |
          TAG=$(python scripts/get_changelog_version.py | tr -d '\r\n')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        run: |
          TAG="${{ steps.changelog.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
            exit 0
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${{ secrets.RELEASE_TAG_PAT }}@github.com/${{ github.repository }}.git"
          git tag "$TAG"
          git push origin "$TAG"
